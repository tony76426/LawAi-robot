name: Legal RAG offline validation

on:
  push:
    branches:
      - main
      - feature/legal-rag-v2-20261116
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax check
        run: python -m compileall -q app.py retrieval.py scripts tests
      - name: Tests without OpenAI key
        env:
          LAWAI_ENABLE_COMPARISON: '0'
        run: python -m unittest discover -s tests -v
      - name: Retrieval baseline
        run: python scripts/evaluate.py
